<style>

/* 
=========================================================
GLOBAL
========================================================= 
*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Kanit',sans-serif;
    background:#071426;
    color:white;
}


/* 
=========================================================
HEADER
========================================================= 
*/

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:78px;
    z-index:20;

    display:flex;
    align-items:center;
    gap:14px;

    padding:10px 22px;

    background:
        linear-gradient(
            90deg,
            rgba(3,12,25,.98),
            rgba(8,27,48,.96),
            rgba(3,12,25,.98)
        );

    border-bottom:2px solid #ff7200;

    box-shadow:
        0 5px 25px rgba(0,0,0,.4);
}

.logo{
    width:55px;
    height:55px;
    object-fit:contain;
    background:white;
}

.header h1{
    font-size:21px;
    font-weight:600;
}

.header p{
    color:#ff9638;
    font-size:12px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    position:fixed;
    top:95px;
    left:20px;
    z-index:20;

    width:310px;

    padding:15px;

    background:rgba(5,18,35,.96);

    border:1px solid #ff7200;

    border-radius:12px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.45);
}

.search-box h3{
    color:#ff9638;
    margin-bottom:10px;
}

.search-row{
    display:flex;
    gap:7px;
}

.search-row input{
    flex:1;

    padding:9px;

    border-radius:7px;

    border:1px solid #40546b;

    background:#102238;

    color:white;

    outline:none;

    font-family:'Kanit';
}

.search-row button{
    border:0;
    border-radius:7px;

    padding:0 13px;

    color:white;

    background:#f56b00;

    cursor:pointer;

    font-family:'Kanit';
}

#searchResult{
    margin-top:8px;
    font-size:12px;
    color:#ffb36b;
}


/* =========================================================
   INFO PANEL
========================================================= */

.info-panel{
    position:fixed;
    top:95px;
    right:20px;

    width:330px;
    max-height:70vh;

    overflow:auto;

    z-index:20;

    padding:18px;

    background:rgba(5,18,35,.97);

    border-radius:12px;

    display:none;

    box-shadow:

}

.info-panel.show{

}

.close-btn{
    position:absolute;
    right:8px;
    top:5px;

    border:0;
    background:none;

    color:white;

    cursor:pointer;

.building-type{

    border-radius:5px;

#buildingTitle{

}

#buildingDescription{

.info-panel h3{
    margin-top:15px;

.info-panel ul{

}

.info-panel li{
    margin-bottom:6px;
    font-size:13px;

/* =========================================================
   CONTROL
========================================================= */

    left:20px;
    bottom:20px;

    z-index:20;

    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.control-box button{

/* =========================================================

========================================================= */

/* =========================================================

========================================================= */

========================================================= */

    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

container.appendChild(

   LABEL RENDERER
========================================================= */

            0.75,

    );

        x,
        1,
        z
    );

    road.rotation.y = rotation;

    road.receiveShadow = true;
    road.castShadow = true;

    scene.add(road);
}

/*เส้นประ*/

function createRoadCenterLine(
    x,
    z,
    length,
    dashLength = 3,
    gap = 3,
    width = 0.25,
    rotation = 0,
    y = 1.3
) {

    const group = new THREE.Group();

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xFFD700
        });

    const count =
        Math.floor(
            length / (dashLength + gap)
        );

    for (let i = 0; i < count; i++) {

        const dash =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width,
                    0.08,
                    dashLength
                ),
                material
            );

        dash.position.z =
            -length / 2
            + dashLength / 2
            + i * (dashLength + gap);

        group.add(dash);
    }

    group.position.set(
        x,
        y,
        z
    );

    group.rotation.y =
        rotation;

    scene.add(group);

    return group;
}

/* =========================================================
   BRIDGE
   ไม่มีแม่น้ำ
========================================================= */

function createArchBridge(
    x,
    z,
    length = 40,
    width = 8,
    height = 10,
    rotation = 0,
    bridgeColor = 0x9E9E9E,
    edgeColor = 0xD9D9D9
) {

    const group = new THREE.Group();

    // =====================================
    // วัสดุตัวสะพาน
    // =====================================

    const bridgeMaterial =
        new THREE.MeshStandardMaterial({
            color: bridgeColor,
            roughness: 0.8
        });

    // =====================================
    // วัสดุขอบสะพาน
    // =====================================

    const edgeMaterial =
        new THREE.MeshStandardMaterial({
            color: edgeColor,
            roughness: 0.8
        });


    const segments = 40;
    const radius = length / 2;


    // =====================================
    // พื้นสะพาน
    // =====================================

    for (let i = 0; i < segments; i++) {

        const t1 =
            i / segments * Math.PI;

        const t2 =
            (i + 1) / segments * Math.PI;

        const x1 =
            -radius * Math.cos(t1);

        const x2 =
            -radius * Math.cos(t2);

        const y1 =
            height * Math.sin(t1);

        const y2 =
            height * Math.sin(t2);

        const dx = x2 - x1;
        const dy = y2 - y1;

        const segmentLength =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const angle =
            -Math.atan2(dy, dx);

        const segment =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    segmentLength,
                    0.8,
                    width
                ),
                bridgeMaterial
            );

        segment.position.set(
            (x1 + x2) / 2,
            (y1 + y2) / 2,
            0
        );

        segment.rotation.z = angle;

        group.add(segment);
    }


    // =====================================
    // ขอบสะพาน
    // =====================================

    const edgeHeight = 1.2;
    const edgeWidth = 0.5;

    for (let i = 0; i < segments; i++) {

        const t1 =
            i / segments * Math.PI;

        const t2 =
            (i + 1) / segments * Math.PI;

        const x1 =
            -radius * Math.cos(t1);

        const x2 =
            -radius * Math.cos(t2);

        const y1 =
            height * Math.sin(t1);

        const y2 =
            height * Math.sin(t2);

        const dx = x2 - x1;
        const dy = y2 - y1;

        const segmentLength =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const angle =
            -Math.atan2(dy, dx);


        // ขอบซ้าย
        const leftEdge =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    segmentLength,
                    edgeHeight,
                    edgeWidth
                ),
                edgeMaterial
            );

        leftEdge.position.set(
            (x1 + x2) / 2,
            (y1 + y2) / 2 + 0.8,
            width / 2 - edgeWidth / 2
        );

        leftEdge.rotation.z = angle;

        group.add(leftEdge);


        // ขอบขวา
        const rightEdge =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    segmentLength,
                    edgeHeight,
                    edgeWidth
                ),
                edgeMaterial
            );

        rightEdge.position.set(
            (x1 + x2) / 2,
            (y1 + y2) / 2 + 0.8,
            -width / 2 + edgeWidth / 2
        );

        rightEdge.rotation.z = angle;

        group.add(rightEdge);
    }


    // =====================================
    // ตำแหน่งสะพาน
    // =====================================

    group.position.set(
        x,
        0.5,
        z
    );

    group.rotation.y =
        rotation;

    scene.add(group);

    return group;
}

    const facadeWhite = new THREE.MeshStandardMaterial({

    });

    const facadeDark = new THREE.MeshStandardMaterial({
        color:0x4b5258,
        roughness:.72,
        metalness:.02
    });

    const glass = new THREE.MeshStandardMaterial({
        color:0x8fc5cb,
        roughness:.18,
        metalness:.08,
        transparent:true,
        opacity:.72
    });

    const glassDark = new THREE.MeshStandardMaterial({
        color:0x244f57,
        roughness:.2,
        metalness:.12,
        transparent:true,
        opacity:.82
    });

    const red = new THREE.MeshStandardMaterial({
        color:0xc94b45,
        roughness:.6,
        metalness:.03
    });

    const redDark = new THREE.MeshStandardMaterial({
        color:0x9f3531,
        roughness:.65,
        metalness:.02
    });

    const railing = new THREE.MeshStandardMaterial({
        color:0xf1f2f2,
        roughness:.55,
        metalness:.08

    const addBox = (w,h,d,x,y,z,material,building=true) => {
        const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(w,h,d),
            material
        );
        mesh.position.set(x,y,z);
        if(building) mesh.userData.building = data;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        return mesh;

    // แผงสีแดงแนวตั้งบนผนังด้านยาวทั้งสองฝั่ง
    addBox(.16, data.height-4, 5.2, data.width/2+.13, data.height/2+.2, -4.5, red);
    addBox(.16, data.height-4, 5.2, -data.width/2-.13, data.height/2+.2, -4.5, red);

    // ซี่แนวนอนบนแผงแดง ให้ใกล้เคียงลักษณะผนังระแนงในภาพ
    for(let i=0;i<12;i++){

    }

    // กล่องกระจกบริเวณหัวอาคาร
    const glassTowerZ = -20.5;
    addBox(5.8, data.height-3, 5.8, data.width/2+.18, data.height/2+1, glassTowerZ, glass);
    addBox(5.8, data.height-3, 5.8, -data.width/2-.18, data.height/2+1, glassTowerZ, glass);

    // เสากรอบกระจกแนวตั้ง
    for(let i=0;i<4;i++){
        const x = data.width/2+.25 + (i-1.5)*1.65;
        addBox(.12,data.height-4,.14,x,data.height/2+1,glassTowerZ-3.0,facadeDark);
        addBox(.12,data.height-4,.14,x,data.height/2+1,glassTowerZ+3.0,facadeDark);
    }

    // หน้าต่างกระจกเล็กบนหัวอาคาร
    for(let row=0; row<6; row++){
        const y = 4.2 + row*4.45;
        addBox(.14,2.15,1.35,data.width/2+.32,y,glassTowerZ-2.0,glassDark);
        addBox(.14,2.15,1.35,data.width/2+.32,y,glassTowerZ+.15,glassDark);
        addBox(.14,2.15,1.35,-data.width/2-.32,y,glassTowerZ-2.0,glassDark);
        addBox(.14,2.15,1.35,-data.width/2-.32,y,glassTowerZ+.15,glassDark);
    }

    // ระเบียงยื่นเรียงตามด้านยาวของอาคาร
    const balconyZ = [-13,-6,1,8,15];
    balconyZ.forEach((z,i)=>{

        addBox(2.0,.35,3.6,data.width/2+1.05,y,z,facadeWhite);
        addBox(2.0,.35,3.6,-data.width/2-1.05,y,z,facadeWhite);

        // ผนัง/ราวกันตกด้านหน้าแต่ละระเบียง
        addBox(.12,1.15,3.55,data.width/2+2.02,y+.65,z,railing);
        addBox(.12,1.15,3.55,-data.width/2-2.02,y+.65,z,railing);
    });

    // แผงหน้าต่างยาวด้านข้างอาคาร
    for(let row=0; row<6; row++){
        const y = 5.2 + row*4.55;
        for(let i=0; i<6; i++){
            const z = -15 + i*6.0;
            addBox(.12,2.0,3.6,data.width/2+.22,y,z,glassDark);
            addBox(.12,2.0,3.6,-data.width/2-.22,y,z,glassDark);
        }
    }

    // กรอบแนวตั้งแบ่งช่วงอาคาร
    for(let i=0;i<8;i++){
        const z = -22 + i*6.2;
        addBox(.22,data.height-3,.24,data.width/2+.28,data.height/2,z,facadeWhite);
        addBox(.22,data.height-3,.24,-data.width/2-.28,data.height/2,z,facadeWhite);
    }

    // หลังคายื่นแบบแผ่นบางตามรูปอาคาร
    addBox(data.width+4.5,1.0,data.depth+2.5,0,data.height+1.25,0,facadeDark);
    addBox(data.width+1.5,.45,data.depth+1.2,0,data.height+1.85,0,facadeWhite);

    // กันสาดบริเวณหัวอาคาร
    addBox(data.width+2.5,.45,4.8,0,data.height-1.5,-21.5,facadeDark);

    // ชั้นฐานด้านล่างให้ดูเป็นทางเข้า/โถงอาคาร
    addBox(data.width+.8,1.2,4.8,0,2.0,-20.5,facadeWhite);
    addBox(data.width+.9,.35,5.2,0,1.2,-20.5,facadeDark);

    // เสารับกันสาดด้านหน้า
    for(let x=-5; x<=5; x+=2.5){
        addBox(.22,3.2,.22,x,2.8,-22.2,facadeDark);
    }
}

/* =========================================================

   ความสูงของตัวอาคารยังใช้ data.height เดิมทุกหลัง
========================================================= */

function createBuilding(
    data
){

    const group =
        new THREE.Group();


    group.userData.building =
        data;


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                data.width,

                data.height,

                data.depth

            ),

            new THREE.MeshStandardMaterial({

                color:data.color,

                roughness:.72,

                metalness:.05

            })

        );


    body.position.y =
        data.height/2;


    body.castShadow =
        true;

    body.receiveShadow =
        true;


    body.userData.building =
        data;


    group.add(
        body
    );





    /* =====================================================
       ROOF
    ===================================================== */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                data.width+1.5,

                1.2,

                data.depth+1.5

            ),

            roofMaterial

        );


    roof.position.y =
        data.height+.6;


    roof.castShadow =
        true;


    roof.userData.building =
        data;


    group.add(
        roof
    );


    /* =====================================================
       VERTICAL FACADE DETAILS
    ===================================================== */

    const facadeCount =
        Math.max(

            2,

            Math.floor(
                data.width/9
            )

        );


    for(

        let i=0;

        i<facadeCount;

        i++

    ){

        const x =

            -data.width/2 +

            (data.width/
            (facadeCount+1)) *

            (i+1);


        const pillar =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    .32,

                    Math.max(
                        3,
                        data.height-.8
                    ),

                    .38

                ),

                frameMaterial

            );


        pillar.position.set(

            x,

            data.height/2,

            data.depth/2+.24

        );


        pillar.userData.building =
            data;


        group.add(
            pillar
        );

    }


    /* =====================================================
       FRONT + BACK WINDOWS
    ===================================================== */

    const rows =
        Math.max(

            1,

            Math.min(

                4,

                Math.floor(
                    data.height/5
                )

            )

        );


    const columns =
        Math.max(

            3,

            Math.floor(
                data.width/5
            )

        );


    for(

        let row=0;

        row<rows;

        row++

    ){

        const y =

            3 +

            row *

            Math.max(

                3.5,

                (data.height-5) /
                Math.max(
                    rows-1,
                    1
                )

            );


        if(
            y >
            data.height-1.5
        )
            continue;


        for(

            let i=0;

            i<columns;

            i++

        ){

            const spacing =

                data.width /
                (columns+1);


            const x =

                -data.width/2 +

                spacing*(i+1);


            const windowFront =
                new THREE.Mesh(

                    new THREE.BoxGeometry(

                        Math.min(
                            2.4,
                            spacing*.58
                        ),

                        Math.min(
                            1.8,
                            Math.max(
                                1.2,
                                data.height/10
                            )
                        ),

                        .18

                    ),

                    windowMaterial

                );


            windowFront.position.set(

                x,

                y,

                data.depth/2+.16

            );


            windowFront.userData.building =
                data;


            group.add(
                windowFront
            );


            const windowBack =
                windowFront.clone();


            windowBack.position.z =
                -data.depth/2-.16;


            group.add(
                windowBack
            );

        }

    }


    /* =====================================================
       SIDE WINDOWS
    ===================================================== */

    const sideRows =
        Math.max(

            1,

            Math.min(

                4,

                Math.floor(
                    data.height/5
                )

            )

        );


    const sideColumns =
        Math.max(

            2,

            Math.floor(
                data.depth/5
            )

        );


    for(

        let row=0;

        row<sideRows;

        row++

    ){

        const y =

            3 +

            row *

            Math.max(

                3.5,

                (data.height-5) /
                Math.max(
                    sideRows-1,
                    1
                )

            );


        if(
            y >
            data.height-1.5
        )
            continue;


        for(

            let i=0;

            i<sideColumns;

            i++

        ){

            const spacing =

                data.depth /
                (sideColumns+1);


            const z =

                -data.depth/2 +

                spacing*(i+1);


            const windowSide =
                new THREE.Mesh(

                    new THREE.BoxGeometry(

                        .18,

                        1.5,

                        Math.min(
                            2.4,
                            spacing*.58
                        )

                    ),

                    windowMaterial

                );


            windowSide.position.set(

                data.width/2+.16,

                y,

                z

            );


            windowSide.userData.building =
                data;


            group.add(
                windowSide
            );


            const windowSide2 =
                windowSide.clone();


            windowSide2.position.x =
                -data.width/2-.16;


            group.add(
                windowSide2
            );

        }

    }


    /* =====================================================
       ORANGE ACCENT BAND
    ===================================================== */

    const accent =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                data.width+.08,

                .55,

                .18

            ),

            accentMaterial

        );


    accent.position.set(

        0,

        Math.min(

            data.height-1,

            Math.max(
                4,
                data.height*.55
            )

        ),

        data.depth/2+.28

    );


    accent.userData.building =
        data;


    group.add(
        accent
    );







    /* =====================================================
       BUILDING LABEL
    ===================================================== */

    const labelDiv =
        document.createElement(
            'div'
        );


    labelDiv.className =
        'building-label';


    labelDiv.textContent =
        data.name;


    const label =
        new CSS2DObject(
            labelDiv
        );


    label.position.set(

        0,

        data.height+4,

        0

    );


    group.add(
        label
    );


    group.position.set(

        data.x,

        0,

        data.z

    );


    scene.add(
        group
    );

    // เรียกใช้การตกแต่งเฉพาะ ID โดยไม่แก้ระบบอื่น
    decorateBuildingByID(data, group);


    data.object =
        group;

}

/*gear*/
function createKMUTNBSign(
    x,
    z,
    width = 25,
    signHeight = 15,      // ความสูงของป้าย
    gearHeight = 18,      // ความสูงของเฟือง
    groundHeight = 0,     // ความสูงจากพื้น
    rotation = 0,
    signColor = 0x4FA7A0,
    gearColor = 0x4FA7A0
) {

    const group = new THREE.Group();


    // =====================================
    // MATERIAL
    // =====================================

    const baseMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x888888,
            roughness: 0.9
        });

    const signMaterial =
        new THREE.MeshStandardMaterial({
            color: signColor,
            roughness: 0.8
        });

    const gearMaterial =
        new THREE.MeshStandardMaterial({
            color: gearColor,
            roughness: 0.7,
            metalness: 0.2
        });


    // =====================================
    // ฐาน
    // =====================================

    const base =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.8,
                4
            ),
            baseMaterial
        );

    base.position.y = 0.4;

    group.add(base);


    // =====================================
    // เสารองป้าย
    // =====================================

    const postCount = 9;

    for (
        let i = 0;
        i < postCount;
        i++
    ) {

        const post =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.5,
                    signHeight * 0.55,
                    0.5
                ),
                baseMaterial
            );

        const px =
            -width / 2 +
            2 +
            i *
            (
                (width - 4) /
                (postCount - 1)
            );

        post.position.set(
            px,
            signHeight * 0.30,
            0
        );

        group.add(post);
    }


    // =====================================
    // แผ่นป้าย
    // =====================================

    const sign =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                3.5,
                0.8
            ),
            signMaterial
        );

    sign.position.y =
        signHeight * 0.62;

    group.add(sign);


    // =====================================
    // ตัวหนังสือ KMUTNB
    // =====================================

    const canvas =
        document.createElement('canvas');

    canvas.width = 1024;
    canvas.height = 256;

    const ctx =
        canvas.getContext('2d');

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = '#FFFFFF';

    ctx.font =
        'bold 150px Arial';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(
        'KMUTNB',
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.colorSpace =
        THREE.SRGBColorSpace;


    const letters =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width * 0.75,
                2
            ),
            new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true
            })
        );

    letters.position.set(
        0,
        signHeight * 0.62,
        -0.43
    );

    letters.rotation.y =
        Math.PI;

    group.add(letters);


    // =====================================
    // เฟือง
    // =====================================

    const gearShape =
        new THREE.Shape();

    const teeth = 12;

    const outerRadius =
        width * 0.19;

    const innerRadius =
        width * 0.145;

    const holeRadius =
        width * 0.055;


    for (
        let i = 0;
        i <= teeth * 2;
        i++
    ) {

        const angle =
            i /
            (teeth * 2) *
            Math.PI *
            2;

        const radius =
            i % 2 === 0
                ? outerRadius
                : innerRadius;

        const px =
            Math.cos(angle) * radius;

        const py =
            Math.sin(angle) * radius;

        if (i === 0) {

            gearShape.moveTo(
                px,
                py
            );

        } else {

            gearShape.lineTo(
                px,
                py
            );
        }
    }

    gearShape.closePath();


    // รูตรงกลาง
    const hole =
        new THREE.Path();

    hole.absarc(
        0,
        0,
        holeRadius,
        0,
        Math.PI * 2,
        true
    );

    gearShape.holes.push(hole);


    // =====================================
    // สร้างเฟือง 3D
    // =====================================

    const gearGeometry =
        new THREE.ExtrudeGeometry(
            gearShape,
            {
                depth: 0.9,
                bevelEnabled: true,
                bevelThickness: 0.12,
                bevelSize: 0.08,
                bevelSegments: 2
            }
        );

    gearGeometry.center();


    const gear =
        new THREE.Mesh(
            gearGeometry,
            gearMaterial
        );


    // ใช้ gearHeight แยกจาก signHeight
    gear.position.set(
        0,
        gearHeight,
        0.1
    );

    gear.rotation.y =
        Math.PI;

    group.add(gear);


    // =====================================
    // ตำแหน่งทั้งหมด
    // =====================================

    group.position.set(
        x,
        groundHeight,
        z
    );

    group.rotation.y =
        rotation;

    scene.add(group);

    return group;
}

function createMarbleTableSet(
    x,
    z,
    scale = 1,
    rotation = 0
) {

    const group = new THREE.Group();

    // =========================
    // วัสดุ
    // =========================

    const marbleMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xE8E8E8,
            roughness: 0.6
        });

    const chairMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x757575,
            roughness: 0.8
        });


    // =========================
    // หน้าโต๊ะ
    // =========================

    const tableTop = new THREE.Mesh(
        new THREE.BoxGeometry(
            8 * scale,
            0.6 * scale,
            5 * scale
        ),
        marbleMaterial
    );

    tableTop.position.y =
        5.0 * scale;

    group.add(tableTop);


    // =========================
    // ขาโต๊ะ
    // =========================

    const tableLeg = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.5 * scale,
            0.6 * scale,
            4.5 * scale,
            12
        ),
        marbleMaterial
    );

    tableLeg.position.y =
        2.5 * scale;

    group.add(tableLeg);


    // =========================
    // สร้างเก้าอี้
    // =========================

    function createChair(
        chairX,
        chairZ
    ) {

        const chair = new THREE.Group();

        // เบาะนั่ง
        const seat = new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5 * scale,
                0.5 * scale,
                2.5 * scale
            ),
            chairMaterial
        );

        seat.position.y =
            2.2 * scale;

        chair.add(seat);


        // ขาเก้าอี้
        const legPositions = [
            [-0.8, -0.8],
            [ 0.8, -0.8],
            [-0.8,  0.8],
            [ 0.8,  0.8]
        ];

        legPositions.forEach(
            ([lx, lz]) => {

                const leg =
                    new THREE.Mesh(
                        new THREE.BoxGeometry(
                            0.25 * scale,
                            2.2 * scale,
                            0.25 * scale
                        ),
                        chairMaterial
                    );

                leg.position.set(
                    lx * scale,
                    1.1 * scale,
                    lz * scale
                );

                chair.add(leg);
            }
        );

        chair.position.set(
            chairX,
            0,
            chairZ
        );

        group.add(chair);
    }


    // =========================
    // เก้าอี้ 4 ตัว
    // =========================

    createChair(
        0,
        -5 * scale
    );

    createChair(
        0,
        5 * scale
    );

    createChair(
        -5 * scale,
        0
    );

    createChair(
        5 * scale,
        0
    );


    // =========================
    // ตำแหน่งชุดโต๊ะ
    // =========================

    group.position.set(
        x,
        1,
        z
    );

    group.rotation.y =
        rotation;

    scene.add(group);

    return group;
}

function futsalCourt(
    x,
    z,
    width = 30,
    length = 50,
    fenceHeight = 8
) {

    /* ==============================
       MATERIALS
    ============================== */

    const grassMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xC62828,
            roughness: 0.8
        });

    const lineMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const fenceMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x0066ff
        });

    const goalMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });


    /* ==============================
       COURT FLOOR
    ============================== */

    const court =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.30,
                length
            ),
            grassMaterial
        );

    court.position.set(
        x,
        0.30,
        z
    );

    scene.add(court);


    /* ==============================
       COURT LINES
    ============================== */

    const lineY = 0.48;


    // LEFT
    const leftLine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.25,
                0.08,
                length
            ),
            lineMaterial
        );

    leftLine.position.set(
        x - width / 2,
        lineY,
        z
    );

    scene.add(leftLine);


    // RIGHT
    const rightLine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.25,
                0.08,
                length
            ),
            lineMaterial
        );

    rightLine.position.set(
        x + width / 2,
        lineY,
        z
    );

    scene.add(rightLine);


    // FRONT
    const frontLine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.08,
                0.25
            ),
            lineMaterial
        );

    frontLine.position.set(
        x,
        lineY,
        z - length / 2
    );

    scene.add(frontLine);


    // BACK
    const backLine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.08,
                0.25
            ),
            lineMaterial
        );

    backLine.position.set(
        x,
        lineY,
        z + length / 2
    );

    scene.add(backLine);


    /* ==============================
       CENTER LINE
    ============================== */

    const centerLine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.08,
                0.20
            ),
            lineMaterial
        );

    centerLine.position.set(
        x,
        lineY,
        z
    );

    scene.add(centerLine);


    /* ==============================
       CENTER CIRCLE
    ============================== */

    const centerCircle =
        new THREE.Mesh(
            new THREE.RingGeometry(
                4.5,
                4.75,
                64
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide
            })
        );

    centerCircle.rotation.x =
        -Math.PI / 2;

    centerCircle.position.set(
        x,
        lineY + 0.02,
        z
    );

    scene.add(centerCircle);


    /* ==============================
       PENALTY AREAS
    ============================== */

    const penaltyWidth = 12;
    const penaltyDepth = 6;


    // FRONT PENALTY AREA

    const penaltyFront =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                penaltyWidth,
                0.08,
                0.20
            ),
            lineMaterial
        );

    penaltyFront.position.set(
        x,
        lineY,
        z - length / 2 + penaltyDepth
    );

    scene.add(penaltyFront);


    // LEFT SIDE OF FRONT PENALTY

    const penaltyFrontLeft =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.20,
                0.08,
                penaltyDepth
            ),
            lineMaterial
        );

    penaltyFrontLeft.position.set(
        x - penaltyWidth / 2,
        lineY,
        z - length / 2 + penaltyDepth / 2
    );

    scene.add(penaltyFrontLeft);


    // RIGHT SIDE OF FRONT PENALTY

    const penaltyFrontRight =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.20,
                0.08,
                penaltyDepth
            ),
            lineMaterial
        );

    penaltyFrontRight.position.set(
        x + penaltyWidth / 2,
        lineY,
        z - length / 2 + penaltyDepth / 2
    );

    scene.add(penaltyFrontRight);


    // BACK PENALTY AREA

    const penaltyBack =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                penaltyWidth,
                0.08,
                0.20
            ),
            lineMaterial
        );

    penaltyBack.position.set(
        x,
        lineY,
        z + length / 2 - penaltyDepth
    );

    scene.add(penaltyBack);


    // LEFT SIDE BACK

    const penaltyBackLeft =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.20,
                0.08,
                penaltyDepth
            ),
            lineMaterial
        );

    penaltyBackLeft.position.set(
        x - penaltyWidth / 2,
        lineY,
        z + length / 2 - penaltyDepth / 2
    );

    scene.add(penaltyBackLeft);


    // RIGHT SIDE BACK

    const penaltyBackRight =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.20,
                0.08,
                penaltyDepth
            ),
            lineMaterial
        );

    penaltyBackRight.position.set(
        x + penaltyWidth / 2,
        lineY,
        z + length / 2 - penaltyDepth / 2
    );

    scene.add(penaltyBackRight);


    /* ==============================
       FENCE POSTS
    ============================== */

    const postRadius = 0.12;

    function fencePost(px, pz) {

        const post =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    postRadius,
                    postRadius,
                    fenceHeight,
                    10
                ),
                fenceMaterial
            );

        post.position.set(
            px,
            fenceHeight / 2,
            pz
        );

        scene.add(post);
    }


    // Corner posts

    fencePost(
        x - width / 2,
        z - length / 2
    );

    fencePost(
        x + width / 2,
        z - length / 2
    );

    fencePost(
        x - width / 2,
        z + length / 2
    );

    fencePost(
        x + width / 2,
        z + length / 2
    );


    // Extra posts along sides

    const postSpacing = 5;


    for (
        let p = -length / 2 + postSpacing;
        p < length / 2;
        p += postSpacing
    ) {

        fencePost(
            x - width / 2,
            z + p
        );

        fencePost(
            x + width / 2,
            z + p
        );
    }


    /* ==============================
       BLUE NET FENCE
    ============================== */

    function createFence(
        px,
        py,
        pz,
        w,
        h,
        d
    ) {

        const fence =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    w,
                    h,
                    d
                ),
                new THREE.MeshBasicMaterial({
                    color: 0x0066ff,
                    transparent: true,
                    opacity: 0.25,
                    wireframe: true
                })
            );

        fence.position.set(
            px,
            py,
            pz
        );

        scene.add(fence);
    }


    // LEFT FENCE

    createFence(
        x - width / 2,
        fenceHeight / 2,
        z,
        0.15,
        fenceHeight,
        length
    );


    // RIGHT FENCE

    createFence(
        x + width / 2,
        fenceHeight / 2,
        z,
        0.15,
        fenceHeight,
        length
    );


    // FRONT FENCE

    createFence(
        x,
        fenceHeight / 2,
        z - length / 2,
        width,
        fenceHeight,
        0.15
    );


    // BACK FENCE

    createFence(
        x,
        fenceHeight / 2,
        z + length / 2,
        width,
        fenceHeight,
        0.15
    );


    /* ==============================
       GOALS
    ============================== */

    function createGoal(goalZ) {

        const goalWidth = 6;
        const goalHeight = 2.4;


        // LEFT POST

        const leftPost =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.25,
                    goalHeight,
                    0.25
                ),
                goalMaterial
            );

        leftPost.position.set(
            x - goalWidth / 2,
            goalHeight / 2,
            goalZ
        );

        scene.add(leftPost);


        // RIGHT POST

        const rightPost =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.25,
                    goalHeight,
                    0.25
                ),
                goalMaterial
            );

        rightPost.position.set(
            x + goalWidth / 2,
            goalHeight / 2,
            goalZ
        );

        scene.add(rightPost);


        // CROSSBAR

        const crossbar =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    goalWidth,
                    0.25,
                    0.25
                ),
                goalMaterial
            );

        crossbar.position.set(
            x,
            goalHeight,
            goalZ
        );

        scene.add(crossbar);
    }


    createGoal(
        z - length / 2
    );

    createGoal(
        z + length / 2
    );
}

/* =========================================================
   RAYCASTER
========================================================= */

const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(

    'click',

    event => {


        mouse.x =

            event.clientX /
            window.innerWidth *
            2 - 1;


        mouse.y =

            -(

                event.clientY /
                window.innerHeight

            ) *
            2 + 1;


        raycaster.setFromCamera(

            mouse,

            camera

        );


        const targets = [];


        buildings.forEach(

            b => {

                b.object.traverse(

                    child => {

                        if(
                            child.isMesh
                        ){

                            targets.push(
                                child
                            );

                        }

                    }

                );

            }

        );


        const hits =
            raycaster.intersectObjects(
                targets
            );


        if(
            hits.length === 0
        ){

            return;

        }


        const data =

            hits[0]
                .object
                .userData
                .building;


        if(data){

            showBuilding(
                data
            );

        }

    }

);


/* =========================================================
   SHOW BUILDING
========================================================= */

function showBuilding(
    data
){

    document.getElementById(
        'buildingType'
    ).textContent =
        data.type;


    document.getElementById(
        'buildingTitle'
    ).textContent =
        data.name;


    document.getElementById(
        'buildingDescription'
    ).textContent =
        data.description;


    const list =
        document.getElementById(
            'departmentList'
        );


    list.innerHTML =
        '';


    data.departments.forEach(

        department => {

            const li =
                document.createElement(
                    'li'
                );


            li.textContent =
                department;


            list.appendChild(
                li
            );

        }

    );


    document.getElementById(
        'infoPanel'
    ).classList.add(
        'show'
    );


    focusBuilding(
        data
    );

}


/* =========================================================
   FOCUS BUILDING
========================================================= */

function focusBuilding(
    data
){

    const target =
        new THREE.Vector3(

            data.x,

            0,

            data.z

        );


    const position =
        new THREE.Vector3(

            data.x+42,

            48,

            data.z+42

        );


    animateCamera(

        position,

        target

    );

}


/* =========================================================
   CAMERA ANIMATION
========================================================= */

function animateCamera(

    position,

    target

){

    const startPosition =
        camera.position.clone();


    const startTarget =
        controls.target.clone();


    const start =
        performance.now();


    const duration =
        600;


    function update(){

        const t =
            Math.min(

                (performance.now()-start) /
                duration,

                1

            );


        const ease =

            1 -

            Math.pow(

                1-t,

                3

            );


        camera.position.lerpVectors(

            startPosition,

            position,

            ease

        );


        controls.target.lerpVectors(

            startTarget,

            target,

            ease

        );


        if(
            t<1
        ){

            requestAnimationFrame(
                update
            );

        }

    }


    update();

}


/* =========================================================
   SEARCH
========================================================= */

function searchBuilding(){

    const keyword =

        document.getElementById(
            'searchInput'
        ).value

        .trim()

        .toLowerCase();


    if(
        !keyword
    ){

        document.getElementById(
            'searchResult'
        ).textContent =
            'กรุณาพิมพ์คำค้นหา';

        return;

    }


    const found =

        buildings.find(

            building => {

                const text = (

                    building.name +

                    ' ' +

                    building.type +

                    ' ' +

                    building.description +

                    ' ' +

                    building.departments.join(' ')

                ).toLowerCase();


                return text.includes(
                    keyword
                );

            }

        );


    if(
        !found
    ){

        document.getElementById(
            'searchResult'
        ).textContent =
            'ไม่พบข้อมูล';

        return;

    }


    document.getElementById(
        'searchResult'
    ).textContent =
        `พบ ${found.name}`;


    showBuilding(
        found
    );

}
